<!DOCTYPE html>
<html>
<head>
    <title>Gatepass Entry</title>

    <style>
    body {
        font-family: Arial;
        background: #f4f6f9;
        padding: 20px;
    }
    h2 {
        text-align: center;
        color: #1e3c72;
    }
    .form-box {
        max-width: 950px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    label {
        display: block;
        margin: 12px 0 6px 0;
        font-weight: bold;
        color: #333;
    }
    input, select, textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        font-size: 16px;
    }
    .file-upload {
        border: 2px dashed #00bcd4;
        padding: 25px;
        text-align: center;
        border-radius: 8px;
        background: #f8f9fa;
        margin: 15px 0;
    }
    .file-upload:hover {
        background: #e3f2fd;
    }
    .checkbox-group {
        margin: 15px 0;
    }
    .checkbox-group label {
        display: inline-block;
        margin-right: 20px;
        font-weight: normal;
    }
    button {
        background: #00bcd4;
        color: white;
        border: none;
        padding: 14px;
        width: 100%;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        margin-top: 10px;
    }
    .back-btn {
        background: #333;
        color: white;
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin-bottom: 20px;
    }
    .file-list div {
        padding: 8px;
        background: #f1f1f1;
        margin: 5px 0;
        border-radius: 4px;
        font-size: 14px;
    }
    </style>
</head>
<body>

<h2>🆔 New Gatepass Entry</h2>

<div style="text-align: center; margin-bottom: 20px;">
    <button onclick="goBackToGatepass()" class="back-btn">
        ⬅ Back to Gatepass
    </button>
</div>

<div class="form-box">

<form id="gatepassForm">

    <label>Block Name</label>
    <input type="text" id="block" readonly style="background:#f0f0f0; font-weight:bold;">

    <label>Gatepass Number</label>
    <input type="text" id="gatepassNo" placeholder="e.g. GP-2026-001" required>

    <label>Date & Time</label>
    <input type="datetime-local" id="dateTime" required>

    <label>Person Name</label>
    <input type="text" id="personName" placeholder="Enter full name" required>

    <label>Purpose / Reason for Gatepass</label>
    <textarea id="purpose" rows="3" placeholder="Why is the gatepass required?"></textarea>

    <label>Going To / Destination</label>
    <input type="text" id="destination" placeholder="Where are they going?" required>

    <label>Expected Return Date & Time</label>
    <input type="datetime-local" id="returnDateTime">

    <div class="checkbox-group">
        <label><input type="checkbox" id="gatepassCopy"> Gate Pass Paper Copy</label>
        <label><input type="checkbox" id="invoiceCopy"> Invoice Copy</label>
        <label><input type="checkbox" id="warranty"> Under Warranty</label>
    </div>

    <label>Warranty / Remarks (if any)</label>
    <textarea id="warrantyRemarks" rows="2" placeholder="Warranty details or additional remarks..."></textarea>

    <!-- File Attachment -->
    <label>📎 File Attachment (Invoice, Photo, Quotation, Document etc.)</label>
    <div class="file-upload">
        <input type="file" id="attachments" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx">
        <p style="color:#666; margin:10px 0 0 0;">Click or drag multiple files here</p>
    </div>
    <div id="fileList" class="file-list"></div>

    <label>Status</label>
    <select id="status">
        <option value="Pending">Pending</option>
        <option value="Approved">Approved</option>
        <option value="Returned">Returned</option>
    </select>

    <button type="submit">Save Gatepass</button>

</form>

</div>

<script>

// Get Block from URL
function getBlockFromURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get("block");
}

// File Handling - Show selected files
let selectedFiles = [];

document.getElementById("attachments").addEventListener("change", function(e) {
    const fileListDiv = document.getElementById("fileList");
    fileListDiv.innerHTML = "";
    selectedFiles = Array.from(e.target.files);

    selectedFiles.forEach(file => {
        const div = document.createElement("div");
        div.innerHTML = `📄 ${file.name} <small>(${(file.size/1024).toFixed(1)} KB)</small>`;
        fileListDiv.appendChild(div);
    });
});

// Convert File to Base64
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

window.onload = function() {
    const blockName = getBlockFromURL();
    if (blockName) {
        document.getElementById("block").value = blockName;
    }
};

// ================= SAVE GATEPASS WITH FILES (Base64) =================
document.getElementById("gatepassForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const attachedFilesData = [];

    // Convert all selected files to Base64
    for (let file of selectedFiles) {
        try {
            const base64 = await fileToBase64(file);
            attachedFilesData.push({
                name: file.name,
                type: file.type,
                size: file.size,
                data: base64
            });
        } catch (err) {
            console.error("Error converting file:", err);
        }
    }

    const formData = {
        gatepassNo: document.getElementById("gatepassNo").value,
        dateTime: document.getElementById("dateTime").value,
        personName: document.getElementById("personName").value,
        purpose: document.getElementById("purpose").value,
        destination: document.getElementById("destination").value,
        returnDateTime: document.getElementById("returnDateTime").value,
        gatepassCopy: document.getElementById("gatepassCopy").checked,
        invoiceCopy: document.getElementById("invoiceCopy").checked,
        warranty: document.getElementById("warranty").checked,
        warrantyRemarks: document.getElementById("warrantyRemarks").value,
        status: document.getElementById("status").value,
        block: document.getElementById("block").value,
        timestamp: new Date().toISOString(),
        attachedFiles: attachedFilesData
    };

    if (!formData.block || !formData.gatepassNo || !formData.personName || !formData.destination) {
        alert("Block, Gatepass Number, Person Name & Destination are mandatory!");
        return;
    }

    const blockKey = "gatepass_" + formData.block.replace(/\s+/g, "_");
    
    let oldData = JSON.parse(localStorage.getItem(blockKey)) || [];
    oldData.push(formData);

    localStorage.setItem(blockKey, JSON.stringify(oldData));

    alert("✅ Gatepass Saved Successfully with Attachments!");

    // Reset Form
    this.reset();
    document.getElementById("fileList").innerHTML = "";
    selectedFiles = [];

    const currentBlock = getBlockFromURL();
    if (currentBlock) {
        document.getElementById("block").value = currentBlock;
    }
});

function goBackToGatepass() {
    window.location.href = "gatepass.html";
}

</script>

</body>
</html>
