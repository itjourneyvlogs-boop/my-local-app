<!DOCTYPE html>
<html>
<head>
    <title>Secure Login</title>

    <style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial;
        background: url('bg.jpg') no-repeat center center/cover;
        height: 100vh;
    }

    .login-box {
        background: rgba(0,0,0,0.7);
        color: white;
        width: 300px;
        padding: 30px;
        border-radius: 10px;
        text-align: center;

        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    input {
        padding: 10px;
        margin: 10px;
        width: 90%;
        border-radius: 5px;
        border: none;
    }

    button {
        padding: 10px 20px;
        background: #00bcd4;
        border: none;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 5px;
    }
    </style>
</head>

<body>

<div class="login-box">
    <h2>🔐 Secure Login</h2>

    <input type="text" id="username" placeholder="Username"><br>
    <input type="password" id="password" placeholder="Password"><br>

    <button onclick="login()">Login</button><br>
    <button onclick="changePassword()">Change Password</button>

    <p id="msg"></p>
</div>

<script>

// 🔐 SHA-256 hash function
async function hashPassword(password) {
    const msgBuffer = new TextEncoder().encode(password);
    const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// ✅ First time setup
(async () => {
    if(!localStorage.getItem("username")) {
        localStorage.setItem("username", "admin");
        const hashed = await hashPassword("1234");
        localStorage.setItem("password", hashed);
    }
})();

// ✅ Login
async function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    let savedUser = localStorage.getItem("username");
    let savedPass = localStorage.getItem("password");

    let hashedInput = await hashPassword(pass);

    if(user === savedUser && hashedInput === savedPass) {
        localStorage.setItem("loggedIn", "true");
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("msg").innerText = "Invalid Login!";
    }
}

// 🔐 Change Password
async function changePassword() {
    let oldPass = prompt("Enter Old Password:");
    let savedPass = localStorage.getItem("password");

    let oldHash = await hashPassword(oldPass);

    if(oldHash === savedPass) {
        let newPass = prompt("Enter New Password:");
        if(newPass && newPass.length >= 4) {
            let newHash = await hashPassword(newPass);
            localStorage.setItem("password", newHash);
            alert("Password Changed Successfully!");
        } else {
            alert("Password must be at least 4 characters!");
        }
    } else {
        alert("Wrong Old Password!");
    }
}

</script>

</body>
</html>
